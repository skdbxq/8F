<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8F - Klasowe Wspomnienia</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0a0e17;       
            --card-bg: #161f30;        
            --primary: #3b82f6;        
            --primary-hover: #2563eb;
            --heart-red: #ff2a4b;
            --text-main: #f1f5f9;      
            --text-muted: #64748b;     
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.3);
            --heart-glow: 0 0 40px rgba(255, 42, 75, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none; overflow: hidden;
            background: radial-gradient(circle at top right, #1e293b, var(--bg-color));
        }

        /* --- NAVI --- */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 1rem 2rem;
            background: rgba(10, 14, 23, 0.95); backdrop-filter: blur(16px);
            border-bottom: 2px solid rgba(59, 130, 246, 0.15);
            display: none; justify-content: space-between; align-items: center; z-index: 100;
        }
        .nav-left { display: flex; align-items: center; gap: 1rem; }
        
        .btn-back {
            display: none;
            background: none; border: 2px solid rgba(59, 130, 246, 0.4); color: var(--text-main);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.2s;
            justify-content: center; align-items: center;
        }
        .btn-back:hover { background: rgba(59, 130, 246, 0.2); border-color: var(--primary); transform: scale(1.1); }

        .nav-logo { font-weight: 900; font-size: 1.6rem; color: var(--text-main); letter-spacing: 1px; }
        .nav-logo span { color: var(--primary); text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .nav-links { display: flex; gap: 0.8rem; align-items: center; }
        
        .nav-btn { background: rgba(255,255,255,0.03); border: 2px solid rgba(59, 130, 246, 0.2); padding: 0.5rem 1.2rem; border-radius: 20px; font-weight: 700; color: var(--text-main); cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif; display: flex; align-items: center; gap: 0.4rem; }
        .nav-btn:hover { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: var(--shadow-glow); transform: translateY(-2px); }
        .nav-btn.upload-btn { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.4); }
        .nav-btn.upload-btn:hover { background: #22c55e; border-color: #22c55e; }

        main { position: relative; z-index: 5; width: 100%; }
        .screen { display: none; min-height: 100vh; width: 100%; padding: 2rem; flex-direction: column; justify-content: center; align-items: center; opacity: 0; }
        .screen.active { display: flex; opacity: 1; }

        /* ==================== ONBOARDING ==================== */
        .verify-box {
            background: var(--card-bg); padding: 3rem; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%;
            border: 2px solid rgba(59, 130, 246, 0.15);
        }
        .verify-box img { width: 120px; height: 120px; object-fit: contain; border-radius: 50%; margin-bottom: 1.5rem; border: 4px solid var(--primary); background: #000; box-shadow: var(--shadow-glow); }
        .verify-box h2 { font-size: 1.9rem; margin-bottom: 1.5rem; color: var(--text-main); font-weight: 800; }
        .verify-box input { width: 100%; padding: 1rem; background: var(--bg-color); border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; font-size: 1.1rem; text-align: center; margin-bottom: 1rem; color: var(--text-main); outline: none; transition: 0.3s; font-family: 'Nunito', sans-serif; font-weight: 600; }
        .verify-box input:focus { border-color: var(--primary); box-shadow: var(--shadow-glow); }
        .btn-verify { width: 100%; padding: 1rem; background: var(--primary); color: #fff; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; transition: 0.3s; }
        .btn-verify:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
        .msg-text { font-weight: 700; margin-top: 1rem; display: none; font-size: 1.1rem; }

        /* ==================== ALBUMY ==================== */
        #albums-screen { justify-content: flex-start; padding-top: 7rem; max-width: 1000px; margin: 0 auto; }
        .screen-header h2 { font-size: 2.6rem; margin-bottom: 1.5rem; color: var(--text-main); text-align: center; font-weight: 900; }
        .albums-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2.5rem; width: 100%; padding: 2rem; }
        
        .album-card { background: var(--card-bg); border-radius: 24px; height: 310px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; cursor: pointer; border: 2px solid rgba(255,255,255,0.05); overflow: hidden; }
        .album-info { background: #fff; padding: 1.3rem; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; text-align: center; font-weight: 800; font-size: 1.25rem; color: #000; z-index: 10; border-top: 1px solid rgba(0,0,0,0.1); transition: background 0.3s, color 0.3s; }
        .card-stack { position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%); width: 82%; height: 62%; }
        .stack-img { position: absolute; width: 100%; height: 100%; object-fit: cover; border-radius: 16px; border: 4px solid #fff; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .stack-img:nth-child(1) { z-index: 3; }
        .stack-img:nth-child(2) { z-index: 2; }

        /* ==================== KATEGORIA ZDJĘĆ ==================== */
        #gallery-screen { justify-content: flex-start; padding-top: 7rem; max-width: 1200px; margin: 0 auto; }
        .domino-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2rem; width: 100%; padding: 0 1.5rem 3rem 1.5rem; }
        .domino-item { position: relative; aspect-ratio: 1; border-radius: 20px; cursor: pointer; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.2); overflow: hidden; background: #000; }
        .domino-item img, .domino-item video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
        .domino-item:hover img, .domino-item:hover video { transform: scale(1.1); }
        
        .video-indicator { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px; border-radius: 50%; display: flex; z-index: 2; }

        .likes-badge { position: absolute; bottom: 12px; right: 12px; background: rgba(0, 0, 0, 0.8); color: var(--heart-red); padding: 6px 14px; border-radius: 20px; font-weight: 900; display: flex; align-items: center; gap: 5px; backdrop-filter: blur(4px); z-index: 2; font-size: 0.95rem; border: 1px solid rgba(255, 42, 75, 0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .likes-badge i { fill: var(--heart-red); color: var(--heart-red); }

        /* ==================== DYNAMICZNY MODAL PODGLĄDU ==================== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5, 7, 13, 0.96); backdrop-filter: blur(16px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 2rem; }
        .modal-box { background: var(--card-bg); border-radius: 28px; max-width: 1100px; width: 100%; height: 85vh; box-shadow: 0 30px 60px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.05); display: flex; overflow: hidden; }
        
        .media-container { flex: 1.4; background: #05080f; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; user-select: none; cursor: pointer; }
        .modal-preview-img, .modal-preview-video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-preview-video { width: 100%; height: 100%; }
        
        .center-pop-heart { position: absolute; color: var(--heart-red); fill: var(--heart-red); font-size: 11rem; opacity: 0; scale: 0; pointer-events: none; z-index: 15; filter: drop-shadow(var(--heart-glow)); transform: translate(-50%, -50%); }

        /* Prawy Panel */
        .social-panel { flex: 1; display: flex; flex-direction: column; border-left: 2px solid rgba(255,255,255,0.05); background: #111827; padding: 1.8rem; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .panel-header h4 { font-weight: 800; color: var(--text-main); font-size: 1.2rem; }
        .btn-close-modal { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .btn-close-modal:hover { color: var(--heart-red); transform: scale(1.2) rotate(90deg); }

        /* Pasek akcji */
        .modal-actions-row { margin-bottom: 1.2rem; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 1.2rem; }
        
        .btn-only-heart { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .btn-only-heart:hover { background: rgba(255, 42, 75, 0.1); border-color: rgba(255, 42, 75, 0.4); transform: scale(1.1); color: var(--heart-red); }
        
        .btn-only-heart.liked { color: var(--heart-red); background: rgba(255, 42, 75, 0.15); border-color: var(--heart-red); box-shadow: var(--heart-glow); }
        .btn-only-heart.liked i { fill: var(--heart-red); color: var(--heart-red); }
        
        .stats-display { display: flex; align-items: center; gap: 1rem; font-weight: 800; font-size: 1rem; color: var(--text-main); }
        .stat-item { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.02); padding: 0.4rem 0.8rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-item i { width: 16px; height: 16px; }
        .stat-item.heart-stat i { color: var(--heart-red); fill: var(--heart-red); }
        .stat-item.comment-stat i { color: var(--primary); }

        /* Komentarze */
        .comments-section { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .comments-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.2rem; padding-right: 0.5rem; }
        
        .comment-item { background: rgba(255,255,255,0.03); padding: 0.9rem; border-radius: 16px; font-size: 0.95rem; border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 0.3rem; position: relative; }
        .comment-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .comment-author { font-weight: 800; color: var(--primary); font-size: 0.9rem; }
        .comment-text { color: var(--text-main); line-height: 1.4; word-break: break-word; padding-right: 1.5rem; }
        
        .comment-actions { display: flex; gap: 1rem; margin-top: 0.2rem; align-items: center; }
        .btn-cmt-action { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; font-family: 'Nunito'; transition: 0.2s; }
        .btn-cmt-action:hover { color: var(--primary); }
        .btn-cmt-action.cmt-liked { color: var(--heart-red); }
        .btn-cmt-action.cmt-liked i { fill: var(--heart-red); color: var(--heart-red); }

        .btn-delete-comment { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; position: absolute; top: 0.9rem; right: 0.9rem; }
        .btn-delete-comment:hover { color: #ef4444; transform: scale(1.15); }

        .replies-container { margin-top: 0.4rem; padding-left: 1rem; border-left: 2px dashed rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 0.4rem; }
        .reply-item { background: rgba(255,255,255,0.01); padding: 0.5rem 0.7rem; border-radius: 10px; font-size: 0.88rem; }
        .reply-author { font-weight: 800; color: #f59e0b; font-size: 0.8rem; }

        .reply-indicator { background: rgba(59, 130, 246, 0.15); padding: 0.4rem 1rem; border-radius: 10px; font-size: 0.85rem; color: var(--primary); font-weight: 700; margin-bottom: 0.5rem; display: none; justify-content: space-between; align-items: center; }
        .reply-indicator i { cursor: pointer; color: var(--text-muted); }
        .reply-indicator i:hover { color: var(--heart-red); }

        .comment-input-row { display: flex; gap: 0.6rem; margin-top: auto; }
        .comment-input-row input { flex-grow: 1; padding: 0.9rem; border-radius: 14px; border: 2px solid rgba(255,255,255,0.08); background: #0a0e17; color: var(--text-main); outline: none; font-family: 'Nunito'; font-weight: 600; transition: border-color 0.2s; }
        .comment-input-row input:focus { border-color: var(--primary); }
        .comment-input-row button { padding: 0.9rem 1.2rem; border-radius: 14px; border: none; background: var(--primary); color: #fff; font-weight: 800; cursor: pointer; font-family: 'Nunito'; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .comment-input-row button:hover { background: var(--primary-hover); transform: scale(1.05); }

        @media (max-width: 768px) {
            .modal-box { flex-direction: column; height: 90vh; }
            .media-container { flex: 1; }
            .social-panel { flex: 1.4; }
        }

        /* Styl ukrytego inputu do wgrywania */
        #global-file-picker { display: none; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>

    <div class="ambient-layer"></div>

    <nav class="navbar" id="main-nav">
        <div class="nav-left">
            <button class="btn-back" id="back-btn" onclick="window.goBack()"><i data-lucide="arrow-left"></i></button>
            <div class="nav-logo">Klasa <span>8F</span></div>
        </div>
        <div class="nav-links">
            <button class="nav-btn upload-btn" id="upload-nav-btn" onclick="triggerFileUpload()" style="display: none;">
                <i data-lucide="plus-circle"></i> Dodaj plik
            </button>
            <input type="file" id="global-file-picker" accept="image/*,video/*" onchange="handleGlobalFileSelect(event)">
            
            <button class="nav-btn" onclick="window.showScreen('albums-screen')"><i data-lucide="images"></i> Albumy</button>
        </div>
    </nav>

    <main>
        <section id="verify-screen" class="screen active">
            <div class="verify-box" id="box-step-nick">
                <img src="https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_E4646.JPG" alt="Kotlet">
                <h2>Jak się nazywasz?</h2>
                <input type="text" id="nick-input" placeholder="Wpisz swoje imię..." onkeypress="if(event.key === 'Enter') handleNickSubmit()">
                <button class="btn-verify" onclick="handleNickSubmit()">Zapisz i przejdź dalej</button>
            </div>

            <div class="verify-box" id="box-step-password" style="display: none; opacity: 0;">
                <img src="https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_E4646.JPG" alt="Kotlet">
                <h2>Kto to jest?</h2>
                <input type="text" id="verify-input" placeholder="Wpisz hasło..." onkeypress="if(event.key === 'Enter') handlePasswordSubmit()">
                <button class="btn-verify" onclick="handlePasswordSubmit()">Sprawdź i wejdź</button>
                <p class="msg-text" id="verify-msg"></p>
            </div>
        </section>

        <section id="albums-screen" class="screen">
            <div class="screen-header"><h2>Nasze Albumy</h2></div>
            <div class="albums-grid" id="albums-grid-container"></div>
        </section>

        <section id="gallery-screen" class="screen">
            <div class="screen-header"><h2 id="gallery-title">Galeria</h2></div>
            <div class="domino-grid" id="domino-grid"></div>
        </section>

        <div class="modal-overlay" id="choice-modal">
            <div class="modal-box">
                <div class="media-container" id="modal-media-container" onclick="window.handleMediaClick(event)">
                    </div>
                
                <div class="social-panel">
                    <div class="panel-header">
                        <h4>Wspomnienie</h4>
                        <button class="btn-close-modal" onclick="window.closeModal()"><i data-lucide="x"></i></button>
                    </div>

                    <div class="modal-actions-row">
                        <button class="btn-only-heart" id="modal-like-btn" onclick="window.toggleLike(true)">
                            <i data-lucide="heart"></i>
                        </button>
                        <div class="stats-display">
                            <div class="stat-item heart-stat">
                                <i data-lucide="heart"></i> <span id="modal-like-count">0</span>
                            </div>
                            <div class="stat-item comment-stat">
                                <i data-lucide="message-circle"></i> <span id="modal-comment-count">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="comments-section">
                        <div class="comments-list" id="modal-comments-list"></div>
                        
                        <div class="reply-indicator" id="reply-box-indicator">
                            <span id="reply-indicator-text">Odpowiadasz...</span>
                            <i data-lucide="x" style="width:16px;height:16px;" onclick="window.cancelReply()"></i>
                        </div>

                        <div class="comment-input-row">
                            <input type="text" id="comment-input" placeholder="Napisz coś..." onkeypress="if(event.key === 'Enter') window.addComment()">
                            <button onclick="window.addComment()"><i data-lucide="send" style="width:18px;height:18px;"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // KONFIGURACJA SUPABASE (Zanim tam wkleisz klucze, pliki zapisują się tymczasowo)
        // ==========================================
        const SUPABASE_URL = "TUTAJ_WKLEJ_PROJECT_URL";
        const SUPABASE_ANON_KEY = "TUTAJ_WKLEJ_ANON_PUBLIC_API_KEY";

        // Twoje uporządkowane linki z GitHuba
        const defaultHardcodedItems = {
            krosnice: [
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4652.PNG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4647.PNG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4651.PNG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4650.PNG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4649.PNG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4648.PNG"
            ],
            bal: [
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_E4641.JPG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/IMG_4636%5B1%5D.PNG",
                "https://raw.githubusercontent.com/skdbxq/8F/refs/heads/main/BPYA0776.JPG"
            ],
            wycieczki: [
                "https://images.unsplash.com/photo-1501555088652-021faa106b9b?q=80&w=500"
            ]
        };

        const categoryNames = { krosnice: "Krośnice", bal: "Bal Ósmoklasisty", wycieczki: "Wycieczki" };
        const inputPlaceholders = [
            "Napisz coś miłego...",
            "Podziel się wspomnieniem...",
            "Ale to były czasy! Skomentuj...",
            "Ktoś pamięta ten moment? Haha"
        ];
        
        let localLikes = JSON.parse(localStorage.getItem('8f_local_likes')) || {};
        let localComments = JSON.parse(localStorage.getItem('8f_local_comments')) || {};

        window.currentCategory = "";
        let selectedMediaUrl = "";
        let screenHistory = [];
        let replyingToCommentIndex = null;
        
        let clickTimer = null; // Obsługa pojedynczego vs podwójnego tapnięcia

        lucide.createIcons();

        // Pomocnicza funkcja sprawdzająca, czy plik to film wideo
        function isVideoUrl(url) {
            return url.toLowerCase().match(/\.(mp4|mov|webm|ogg|quicktime)/) || url.includes("video");
        }

        // --- ONBOARDING ---
        function handleNickSubmit() {
            const nickVal = document.getElementById('nick-input').value.trim();
            if(!nickVal) {
                alert("Najpierw musisz wpisać swoje imię!");
                return;
            }
            localStorage.setItem('8f_nick', nickVal);
            
            gsap.to('#box-step-nick', { scale: 0.8, opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('box-step-nick').style.display = 'none';
                const pwdBox = document.getElementById('box-step-password');
                pwdBox.style.display = 'block';
                gsap.to(pwdBox, { scale: 1, opacity: 1, duration: 0.3 });
                document.getElementById('verify-input').focus();
            }});
        }

        function handlePasswordSubmit() {
            const input = document.getElementById('verify-input').value.trim().toLowerCase();
            const msgBox = document.getElementById('verify-msg');
            msgBox.style.display = 'block';

            if(input === 'kotlet') {
                msgBox.innerText = "Dobra odpowiedź 😊";
                msgBox.style.color = "#4CAF50"; 
                setTimeout(() => enterAppDirectly(), 400);
            } else {
                msgBox.innerText = "Zła odpowiedź 😞 Spróbuj jeszcze raz.";
                msgBox.style.color = "#FF6B6B"; 
                gsap.fromTo('#box-step-password', {x:-12}, {x:12, duration:0.08, yoyo:true, repeat:4});
            }
        }

        function enterAppDirectly() {
            gsap.to('.verify-box', { scale: 0.8, opacity: 0, duration: 0.4, onComplete: () => {
                document.getElementById('main-nav').style.display = 'flex';
                document.getElementById('upload-nav-btn').style.display = 'inline-flex';
                window.showScreen('albums-screen');
            }});
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('8f_nick')) {
                document.getElementById('box-step-nick').style.display = 'none';
                document.getElementById('box-step-password').style.display = 'block';
                document.getElementById('box-step-password').style.opacity = '1';
            }
        });

        // --- OBSŁUGA STRON ---
        window.showScreen = function(screenId, isGoingBack = false) {
            const currentScreen = document.querySelector('.screen.active');
            if (currentScreen && currentScreen.id === screenId) return;

            if (!isGoingBack && currentScreen && currentScreen.id !== 'verify-screen') {
                screenHistory.push(currentScreen.id);
            }
            
            if (currentScreen) {
                gsap.to(currentScreen, { opacity: 0, scale: 0.95, y: -10, duration: 0.3, onComplete: () => {
                    currentScreen.classList.remove('active');
                    showNewScreen(screenId);
                }});
            } else {
                showNewScreen(screenId);
            }

            const backBtn = document.getElementById('back-btn');
            if (screenHistory.length > 0 && screenId !== 'verify-screen') {
                backBtn.style.display = 'inline-flex';
            } else {
                backBtn.style.display = 'none';
            }
        };

        function showNewScreen(screenId) {
            const nextScreen = document.getElementById(screenId);
            nextScreen.classList.add('active');
            window.scrollTo(0,0);
            
            gsap.fromTo(nextScreen, { opacity: 0, scale: 0.95, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" });
            if(screenId === 'albums-screen') renderAlbums();
        }

        window.goBack = function() {
            if (screenHistory.length > 0) window.showScreen(screenHistory.pop(), true);
        };

        // --- SYSTEM WGRIWANIA PLIKÓW ---
        function triggerFileUpload() {
            if(!window.currentCategory) {
                alert("Najpierw wejdź do wybranego albumu, do którego chcesz wrzucić plik!");
                return;
            }
            document.getElementById('global-file-picker').click();
        }

        function handleGlobalFileSelect(event) {
            const file = event.target.files[0];
            if(!file) return;

            // Tworzymy lokalny adres URL tylko na czas prezentacji pliku przed spięciem Supabase
            const fakeUploadedUrl = URL.createObjectURL(file);
            
            // Dodajemy plik do pamięci podręcznej aktualnego albumu
            defaultHardcodedItems[window.currentCategory].unshift(fakeUploadedUrl);
            
            alert(`Pomyślnie wgrano plik do albumu ${categoryNames[window.currentCategory]}! Po skonfigurowaniu Supabase pojawi się on u wszystkich.`);
            renderGalleryGrid();
            event.target.value = ''; // Reset inputu
        }

        // --- GENEROWANIE ALBUMÓW ---
        function renderAlbums() {
            const container = document.getElementById('albums-grid-container');
            if (!container) return;
            container.innerHTML = "";

            Object.keys(categoryNames).forEach((catKey, index) => {
                const name = categoryNames[catKey];
                const cover = defaultHardcodedItems[catKey][0];

                const div = document.createElement('div');
                div.className = 'album-card';
                div.style.opacity = '0';
                
                let coverHtml = `<img src="${cover}" class="stack-img img-s1">`;
                if(isVideoUrl(cover)) {
                    coverHtml = `<video src="${cover}" class="stack-img img-s1" muted></video>`;
                }

                div.innerHTML = `
                    <div class="card-stack">
                        ${coverHtml}
                        ${coverHtml.replace('img-s1', 'img-s2')}
                    </div>
                    <div class="album-info">${name}</div>
                `;
                
                div.onclick = () => {
                    window.currentCategory = catKey;
                    document.getElementById('gallery-title').innerText = name;
                    window.showScreen('gallery-screen');
                    renderGalleryGrid();
                };

                div.addEventListener('mouseenter', () => {
                    gsap.to(div, { borderColor: 'var(--primary)', boxShadow: 'var(--shadow-glow)', y: -10, duration: 0.3 });
                    gsap.to(div.querySelector('.img-s1'), { rotate: -8, x: -10, y: -10, duration: 0.3 });
                    gsap.to(div.querySelector('.img-s2'), { rotate: 8, x: 10, y: -5, duration: 0.3 });
                    gsap.to(div.querySelector('.album-info'), { background: 'var(--primary)', color: '#fff', duration: 0.3 });
                });
                div.addEventListener('mouseleave', () => {
                    gsap.to(div, { borderColor: 'rgba(255,255,255,0.05)', boxShadow: 'none', y: 0, duration: 0.3 });
                    gsap.to(div.querySelectorAll('.stack-img'), { rotate: 0, x: 0, y: 0, duration: 0.3 });
                    gsap.to(div.querySelector('.album-info'), { background: '#fff', color: '#000', duration: 0.3 });
                });

                container.appendChild(div);
                gsap.fromTo(div, {opacity: 0, y: 30, scale: 0.9}, {opacity: 1, y: 0, scale: 1, duration: 0.4, delay: index * 0.1, ease: "power2.out"});
            });
            lucide.createIcons();
        }

        // --- GALERIA ZDJĘĆ / WIDEO ---
        function renderGalleryGrid() {
            const grid = document.getElementById('domino-grid');
            if(!grid) return;
            grid.innerHTML = "";

            let items = [...defaultHardcodedItems[window.currentCategory]];
            let mappedItems = items.map(url => ({ url: url, likes: localLikes[url] || 0 }));
            mappedItems.sort((a, b) => b.likes - a.likes);

            mappedItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'domino-item';
                div.style.opacity = '0';
                
                div.onclick = () => window.openMediaModal(item.url);

                div.addEventListener('mouseenter', () => gsap.to(div, { scale: 1.05, borderColor: 'var(--primary)', boxShadow: 'var(--shadow-glow)', zIndex: 10, duration: 0.2 }));
                div.addEventListener('mouseleave', () => gsap.to(div, { scale: 1, borderColor: '#fff', boxShadow: '0 6px 18px rgba(0,0,0,0.2)', zIndex: 1, duration: 0.2 }));

                let mediaElement = `<img src="${item.url}" loading="lazy">`;
                let videoTag = '';
                
                if(isVideoUrl(item.url)) {
                    mediaElement = `<video src="${item.url}" muted loop playsinline></video>`;
                    videoTag = `<div class="video-indicator"><i data-lucide="video" style="width:14px;height:14px;"></i></div>`;
                    
                    div.addEventListener('mouseenter', () => div.querySelector('video').play());
                    div.addEventListener('mouseleave', () => {
                        const v = div.querySelector('video');
                        v.pause();
                        v.currentTime = 0;
                    });
                }

                if(item.likes > 0) {
                    mediaElement += `<div class="likes-badge"><i data-lucide="heart" style="width:14px;height:14px;"></i> ${item.likes}</div>`;
                }

                div.innerHTML = mediaElement + videoTag;
                grid.appendChild(div);
                
                gsap.fromTo(div, { opacity: 0, scale: 0.8, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, delay: index * 0.05, ease: "back.out(1.2)" });
            });
            lucide.createIcons();
        }

        // --- ROZRÓŻNIANIE SINGLE CLICK (FULLSCREEN) OD DOUBLE CLICK (LIKE) ---
        window.handleMediaClick = function(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (clickTimer == null) {
                clickTimer = setTimeout(function () {
                    clickTimer = null;
                    // Pojedyncze kliknięcie -> Tryb Fullscreen elementu domowego
                    const element = e.target.closest('.modal-preview-img') || e.target.closest('.modal-preview-video');
                    if (element) {
                        if (element.requestFullscreen) element.requestFullscreen();
                        else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
                        else if (element.msRequestFullscreen) element.msRequestFullscreen();
                    }
                }, 250);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                // Podwójne kliknięcie -> Like
                if(!localLikes[selectedMediaUrl] || localLikes[selectedMediaUrl] === 0) {
                    window.toggleLike(false); 
                }
                playTargetedHeartAnimation(x, y);
            }
        };

        function playTargetedHeartAnimation(x, y) {
            const centerHeart = document.getElementById('center-heart');
            if(!centerHeart) return;
            
            centerHeart.style.left = `${x}px`;
            centerHeart.style.top = `${y}px`;
            
            gsap.killTweensOf(centerHeart);
            gsap.fromTo(centerHeart, 
                { scale: 0, opacity: 0, rotation: -25 },
                { scale: 1, opacity: 1, rotation: 10, duration: 0.25, ease: "back.out(2)", onComplete: () => {
                    gsap.to(centerHeart, { scale: 0, opacity: 0, delay: 0.3, duration: 0.2, ease: "power2.in" });
                }}
            );
        }

        // --- OKNO MODALU ---
        window.openMediaModal = function(url) {
            selectedMediaUrl = url;
            replyingToCommentIndex = null;
            document.getElementById('reply-box-indicator').style.display = 'none';

            const randPlaceholder = inputPlaceholders[Math.floor(Math.random() * inputPlaceholders.length)];
            document.getElementById('comment-input').placeholder = randPlaceholder;

            const container = document.getElementById('modal-media-container');
            
            if(isVideoUrl(url)) {
                container.innerHTML = `
                    <video src="${url}" class="modal-preview-video" controls autoplay loop playsinline></video>
                    <i data-lucide="heart" class="center-pop-heart" id="center-heart"></i>
                `;
            } else {
                container.innerHTML = `
                    <img src="${url}" class="modal-preview-img">
                    <i data-lucide="heart" class="center-pop-heart" id="center-heart"></i>
                `;
            }

            updateModalSocials();

            const modal = document.getElementById('choice-modal');
            modal.style.display = 'flex';
            
            gsap.fromTo('.modal-box', { scale: 0.7, opacity: 0, rotationX: -15 }, { scale: 1, opacity: 1, rotationX: 0, duration: 0.4, ease: "back.out(1.5)" });
            gsap.fromTo('.social-panel', { x: 50, opacity: 0 }, { x: 0, opacity: 1, delay: 0.1, duration: 0.3 });
            lucide.createIcons();
        };

        window.closeModal = function() {
            const video = document.querySelector('.modal-preview-video');
            if(video) video.pause();

            gsap.to('.modal-box', { scale: 0.8, opacity: 0, duration: 0.2, onComplete: () => {
                document.getElementById('choice-modal').style.display = 'none';
                renderGalleryGrid(); 
            }});
        };

        function updateModalSocials() {
            const likesCount = localLikes[selectedMediaUrl] || 0;
            document.getElementById('modal-like-count').innerText = likesCount;

            const comments = localComments[selectedMediaUrl] || [];
            document.getElementById('modal-comment-count').innerText = comments.length;

            const likeBtn = document.getElementById('modal-like-btn');
            if(likesCount > 0) likeBtn.classList.add('liked');
            else likeBtn.classList.remove('liked');

            const commentsList = document.getElementById('modal-comments-list');
            commentsList.innerHTML = '';
            
            if(comments.length === 0) {
                commentsList.innerHTML = '<p style="color:var(--text-muted); font-size:0.95rem; text-align:center; padding-top: 2rem;">Brak wiadomości. Napisz coś!</p>';
            } else {
                comments.forEach((c, i) => {
                    let cmtLikes = c.likes || 0;
                    let isCmtLiked = c.isLiked ? 'cmt-liked' : '';
                    
                    let repliesHtml = '';
                    if(c.replies && c.replies.length > 0) {
                        repliesHtml = '<div class="replies-container">';
                        c.replies.forEach(r => {
                            repliesHtml += `
                                <div class="reply-item">
                                    <div class="reply-author">${r.nick}</div>
                                    <div>${r.text}</div>
                                </div>
                            `;
                        });
                        repliesHtml += '</div>';
                    }

                    commentsList.innerHTML += `
                        <div class="comment-item" id="cmt-${i}" style="opacity:0; transform:scale(0.9) translateY(10px);">
                            <div class="comment-top">
                                <div class="comment-author">${c.nick}</div>
                                <button class="btn-cmt-action ${isCmtLiked}" onclick="window.likeComment(${i})">
                                    <i data-lucide="heart" style="width:14px;height:14px;"></i> <span>${cmtLikes}</span>
                                </button>
                            </div>
                            <div class="comment-text">${c.text}</div>
                            
                            <button class="btn-delete-comment" onclick="window.deleteComment(${i})" title="Usuń komentarz">
                                <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                            </button>

                            <div class="comment-actions">
                                <button class="btn-cmt-action" onclick="window.prepareReply(${i}, '${c.nick}')">
                                    <i data-lucide="message-square" style="width:12px;height:12px;"></i> Odpowiedz
                                </button>
                            </div>
                            ${repliesHtml}
                        </div>
                    `;
                });

                gsap.to('.comment-item', { opacity: 1, scale: 1, translateY: 0, stagger: 0.05, duration: 0.3, ease: "back.out(1.2)" });
            }
            commentsList.scrollTop = commentsList.scrollHeight;
            lucide.createIcons();
        }

        window.toggleLike = function(triggerVisualHeart = false) {
            if(!localLikes[selectedMediaUrl]) {
                localLikes[selectedMediaUrl] = 1;
                if(triggerVisualHeart) {
                    const container = document.getElementById('modal-media-container');
                    playTargetedHeartAnimation(container.clientWidth / 2, container.clientHeight / 2);
                }
            } else {
                localLikes[selectedMediaUrl] = 0; 
            }
            localStorage.setItem('8f_local_likes', JSON.stringify(localLikes));
            gsap.fromTo('#modal-like-btn i', { scale: 1 }, { scale: 1.5, duration: 0.15, yoyo: true, repeat: 1, ease: "back.out(1.5)" });
            updateModalSocials();
        };

        window.deleteComment = function(index) {
            let comments = localComments[selectedMediaUrl] || [];
            if(!comments[index]) return;

            gsap.to(`#cmt-${index}`, { opacity: 0, scale: 0.8, x: -50, filter: "blur(5px)", duration: 0.25, onComplete: () => {
                comments.splice(index, 1);
                localComments[selectedMediaUrl] = comments;
                localStorage.setItem('8f_local_comments', JSON.stringify(localComments));
                updateModalSocials();
            }});
        };

        window.prepareReply = function(index, authorNick) {
            replyingToCommentIndex = index;
            document.getElementById('reply-indicator-text').innerText = `Odpowiadasz użytkownikowi ${authorNick}`;
            const indicator = document.getElementById('reply-box-indicator');
            indicator.style.display = 'flex';
            gsap.fromTo(indicator, {y: 10, opacity: 0}, {y: 0, opacity: 1, duration: 0.2});
            document.getElementById('comment-input').focus();
        };

        window.cancelReply = function() {
            replyingToCommentIndex = null;
            document.getElementById('reply-box-indicator').style.display = 'none';
        };

        window.likeComment = function(index) {
            let comments = localComments[selectedMediaUrl] || [];
            if(!comments[index]) return;

            if(!comments[index].likes) comments[index].likes = 0;

            if(comments[index].isLiked) {
                comments[index].likes--;
                comments[index].isLiked = false;
            } else {
                comments[index].likes++;
                comments[index].isLiked = true;
                const heartIcon = document.querySelector(`#cmt-${index} .btn-cmt-action i`);
                if(heartIcon) gsap.fromTo(heartIcon, {scale: 1}, {scale: 1.5, duration: 0.15, yoyo: true, repeat: 1});
            }

            localComments[selectedMediaUrl] = comments;
            localStorage.setItem('8f_local_comments', JSON.stringify(localComments));
            updateModalSocials();
        };

        window.addComment = function() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text) return;

            let myNick = localStorage.getItem('8f_nick') || "Anonim";
            let comments = localComments[selectedMediaUrl] || [];

            if(replyingToCommentIndex !== null) {
                if(!comments[replyingToCommentIndex].replies) {
                    comments[replyingToCommentIndex].replies = [];
                }
                comments[replyingToCommentIndex].replies.push({ nick: myNick, text: text });
                window.cancelReply();
            } else {
                comments.push({ nick: myNick, text: text, likes: 0, isLiked: false, replies: [] });
            }

            localComments[selectedMediaUrl] = comments;
            localStorage.setItem('8f_local_comments', JSON.stringify(localComments));
            input.value = '';
            
            updateModalSocials();
        };
    </script>
</body>
</html>
